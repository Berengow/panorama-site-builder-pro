<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panorama Site Builder Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <link rel="stylesheet" href="css/builder.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">360°</div>
        <span>Panorama Builder</span>
      </div>
      <div class="project-name">
        <input type="text" id="projectName" value="Новый тур" placeholder="Название тура">
      </div>
      <div class="header-actions">
        <button id="btnSave" class="btn btn-secondary">Сохранить проект</button>
        <button id="btnLoad" class="btn btn-secondary">Загрузить</button>
        <button id="btnExport" class="btn btn-primary">Экспорт сайта</button>
      </div>
    </header>
    <div class="main-layout">
      <aside class="sidebar left-sidebar">
        <div class="sidebar-header">
          <h3>Сцены</h3>
          <button id="btnAddScenes" class="btn btn-small btn-primary">+ Добавить</button>
          <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
        </div>
        <div id="scenesList" class="scenes-list">
          <div class="empty-state">Загрузите панорамы</div>
        </div>
      </aside>
      <main class="preview-area">
        <div id="previewContainer" class="preview-container">
          <div class="preview-placeholder">
            <div class="placeholder-content">
              <h2>Живой предпросмотр</h2>
              <p>Добавьте сцены для начала работы</p>
            </div>
          </div>
          <div id="pannellumContainer" style="width:100%;height:100%;display:none;"></div>
        </div>
        <div class="preview-toolbar">
          <button id="btnAddHotspot" class="btn btn-small">+ Хотспот</button>
          <span id="hotspotModeIndicator" class="mode-indicator" style="display:none;">Кликните на панораму</span>
          <button id="btnResetView" class="btn btn-small">Сбросить вид</button>
        </div>
      </main>
      <aside class="sidebar right-sidebar">
        <div class="tabs">
          <button class="tab active" data-tab="general">Общее</button>
          <button class="tab" data-tab="theme">Тема</button>
          <button class="tab" data-tab="modules">Модули</button>
          <button class="tab" data-tab="hotspots">Хотспоты</button>
        </div>
        <div id="tab-general" class="tab-content active">
          <div class="form-group">
            <label>Качество экспорта</label>
            <select id="exportQuality">
              <option value="high">Высокое</option>
              <option value="medium" selected>Среднее</option>
              <option value="low">Низкое</option>
            </select>
          </div>
          <div class="form-group toggle-group">
            <label>Автоповорот</label>
            <label class="switch"><input type="checkbox" id="autoRotate"><span class="slider"></span></label>
          </div>
          <div class="form-group toggle-group">
            <label>Прогресс-бар</label>
            <label class="switch"><input type="checkbox" id="showProgress" checked><span class="slider"></span></label>
          </div>
        </div>
        <div id="tab-theme" class="tab-content"></div>
        <div id="tab-modules" class="tab-content"></div>
        <div id="tab-hotspots" class="tab-content"></div>
      </aside>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
